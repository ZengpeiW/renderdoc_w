[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rendertest-agent-mcp"
version = "0.1.0"
description = "MCP server for RenderTest's built-in agent bridge"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anyio>=4.5,<5",
  "mcp>=1.20,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
claude = [
  "claude-agent-sdk==0.2.152",
]
test = [
  "pytest>=8.3,<10",
]

[project.scripts]
rendertest-mcp = "rendertest_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rendertest_mcp"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q -p no:cacheprovider"
